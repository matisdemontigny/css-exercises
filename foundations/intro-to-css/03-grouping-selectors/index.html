<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grouping Selectors</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>It's time to wake up <span id="neo">Neo</span><span id="caret">|</span></h1>
  <button class="red-pill"></button>
  <button class="blue-pill"></button>
  <script>
    const caret = document.getElementById("caret");

    setInterval(() => {
        caret.style.color = (caret.style.color === "black") ? "white" : "black";
    }, 700)
    run();
  </script>
</body>

</html>
